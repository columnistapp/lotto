<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <title>Columnist: Lotto Analytics AI — Advanced Analysis, AI &amp; Simulation</title>
  <meta name="description" content="Discover Columnist: Lotto Analytics AI. Explore advanced analysis tools, AI-assisted analysis and historical simulations. Choose the official app store for your device.">
  <link rel="canonical" href="https://columnistapp.github.io/lotto/app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="tr_TR">
  <meta property="og:site_name" content="Columnist: Lotto Analytics AI">
  <meta property="og:url" content="https://columnistapp.github.io/lotto/app/">
  <meta property="og:title" content="Columnist: Lotto Analytics AI">
  <meta property="og:description" content="Gelişmiş Analiz • AI • Simülasyon">
  <meta property="og:image" content="https://columnistapp.github.io/lotto/app/og-image-english-exact.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Columnist: Lotto Analytics AI">
  <meta name="twitter:description" content="Gelişmiş Analiz • AI • Simülasyon">

  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1a2a;--text:#f3f8ff;--muted:#a9bacd;--line:#263d56;--cyan:#20d8ed;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 18px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#102b49 0%,var(--bg) 62%);color:var(--text);line-height:1.6}
    main{width:min(100%,720px);padding:clamp(22px,5vw,42px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,#102238 0%,var(--panel) 64%);box-shadow:0 22px 70px #0006;text-align:center}
    .brand{width:100%;height:auto;display:block;border-radius:14px;margin:0 auto 26px}
    h1{font-size:clamp(1.55rem,5vw,2.25rem);line-height:1.18;margin:0 0 10px;letter-spacing:-.025em}
    .tagline{color:var(--cyan);font-weight:700;font-size:clamp(1rem,3.2vw,1.2rem);margin:0 0 12px}
    .stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:22px}
    .store{display:flex;align-items:center;justify-content:flex-start;gap:13px;min-height:68px;padding:12px 15px;border:1px solid #365270;border-radius:13px;background:#142b43;color:var(--text);font-weight:650;text-decoration:none;text-align:left;transition:background .15s,border-color .15s,opacity .15s}
    a.store:hover{background:#1a3958;border-color:var(--cyan)}
    .store-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center}
    .store-icon svg{display:block;width:100%;height:100%}
    .store-name{flex:1;line-height:1.25}
    .store-status{flex:0 0 auto;padding:4px 7px;border:1px solid #43536a;border-radius:7px;color:#91a2b6;font-size:.68rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
    .store.is-disabled{background:#101d2c;border-color:#24364b;color:#74859a;opacity:.58;cursor:not-allowed;filter:saturate(.25)}
    .store.is-disabled .store-icon{filter:grayscale(1)}
    :focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    @media(max-width:520px){body{padding:16px 12px}main{padding:22px 16px}.stores{grid-template-columns:1fr}.store{min-height:64px}}
    @media(prefers-reduced-motion:reduce){.store{transition:none}}
  </style>
</head>
<body>
<main>
  <img class="brand" src="./og-image-english-exact.jpg" width="1200" height="630" alt="Columnist: Advanced Analysis, AI and Simulation" fetchpriority="high">
  <h1 id="heading">Columnist: Lotto Analytics AI</h1>
  <p class="tagline" id="tagline">Advanced Analysis • AI • Simulation</p>
  <nav class="stores" id="stores" aria-label="Official app stores">
    <div class="store" data-store="ios" aria-disabled="true"><span class="store-name">Apple App Store</span></div>
    <div class="store" data-store="android" aria-disabled="true"><span class="store-name">Google Play</span></div>
    <div class="store" data-store="huawei" aria-disabled="true"><span class="store-name">Huawei AppGallery</span></div>
    <div class="store" data-store="harmony" aria-disabled="true"><span class="store-name">AppGallery • HarmonyOS NEXT</span></div>
    <div class="store" data-store="windows" aria-disabled="true"><span class="store-name">Microsoft Store</span></div>
  </nav>
</main>

<script src="./store-config.js"></script>
<script>
(function(){
  "use strict";
  var ua=String(navigator.userAgent||"");
  var lower=ua.toLowerCase();
  var lang=(navigator.language||"en").toLowerCase();
  var tr=lang==="tr"||lang.indexOf("tr-")===0;
  document.documentElement.lang=tr?"tr-TR":"en";

  var defaults={ios:true,android:true,huawei:true,harmony:false,windows:false};
  var config=window.COLUMNIST_STORE_CONFIG||defaults;
  var icons={
    ios:'<svg viewBox="0 0 384 512" role="img" aria-label="Apple"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-27-47.2-41.9-84.8-44.8-35.6-2.8-74.6 20.8-88.9 20.8-15.1 0-49.7-19.8-76.8-19.8C62.3 141 4 184.4 4 273.2c0 26.2 4.8 53.2 14.4 81 12.9 36.7 59.4 126.6 107.8 125.1 25.4-.6 43.3-18.1 76.3-18.1 32 0 48.6 18.1 76.9 18.1 48.8-.7 90.8-82.4 103.1-119.2-65.5-30.9-63.8-89.5-63.8-91.4zM261.5 104.8c27.4-32.5 24.9-62.2 24.1-72.8-24.2 1.4-52.2 16.5-68.1 35-17.5 19.8-27.8 44.3-25.6 72 26.2 2 50.1-11.4 69.6-34.2z"/></svg>',
    android:'<svg viewBox="0 0 48 48" role="img" aria-label="Google Play"><path fill="#34A853" d="M5.2 4.2c-.8.8-1.2 1.8-1.2 3.2v33.2c0 1.4.4 2.5 1.2 3.2L24 24 5.2 4.2z"/><path fill="#4285F4" d="M5.2 43.8c1.1 1 2.8 1.1 4.6.1L31 32.2 24 24 5.2 43.8z"/><path fill="#FBBC04" d="M42.3 20.1 33.7 15 24 24l9.7 8 8.6-5.1c3.1-1.8 3.1-5 0-6.8z"/><path fill="#EA4335" d="M9.8 4.1c-1.8-1-3.5-.9-4.6.1L24 24l9.7-9L9.8 4.1z"/></svg>',
    huawei:'<svg viewBox="0 0 48 48" role="img" aria-label="Huawei AppGallery"><rect x="2" y="2" width="44" height="44" rx="10" fill="#F04452"/><path d="M11 8c0 4.1 2.8 6.1 13 6.1S37 12.1 37 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><g fill="#fff"><path d="M24 18c-3.7 4.1-4.3 8.2-1.7 11.3.6.8 1.2 1.4 1.7 1.8.5-.4 1.1-1 1.7-1.8 2.6-3.1 2-7.2-1.7-11.3z"/><path d="M15.2 20c-.9 5.2 1.1 8.8 4.8 9.5 1 .2 1.8.2 2.5 0-1.1-4.2-3.4-7.3-7.3-9.5z"/><path d="M8.7 26c2.1 4.8 5.6 6.7 9 5.1.9-.4 1.6-.9 2.1-1.4-3.2-2.9-6.7-4.1-11.1-3.7z"/><path d="M13.2 35.4c4.5 2.7 8.3 1.9 9.8-1.5.4-.9.6-1.7.5-2.4-4.3-.1-7.7 1.1-10.3 3.9z"/><path d="M32.8 35.4c-4.5 2.7-8.3 1.9-9.8-1.5-.4-.9-.6-1.7-.5-2.4 4.3-.1 7.7 1.1 10.3 3.9z"/><path d="M39.3 26c-2.1 4.8-5.6 6.7-9 5.1-.9-.4-1.6-.9-2.1-1.4 3.2-2.9 6.7-4.1 11.1-3.7z"/><path d="M32.8 20c.9 5.2-1.1 8.8-4.8 9.5-1 .2-1.8.2-2.5 0 1.1-4.2 3.4-7.3 7.3-9.5z"/></g></svg>',
    harmony:'<svg viewBox="0 0 48 48" role="img" aria-label="Huawei AppGallery"><rect x="2" y="2" width="44" height="44" rx="10" fill="#F04452"/><path d="M11 8c0 4.1 2.8 6.1 13 6.1S37 12.1 37 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><g fill="#fff"><path d="M24 18c-3.7 4.1-4.3 8.2-1.7 11.3.6.8 1.2 1.4 1.7 1.8.5-.4 1.1-1 1.7-1.8 2.6-3.1 2-7.2-1.7-11.3z"/><path d="M15.2 20c-.9 5.2 1.1 8.8 4.8 9.5 1 .2 1.8.2 2.5 0-1.1-4.2-3.4-7.3-7.3-9.5z"/><path d="M8.7 26c2.1 4.8 5.6 6.7 9 5.1.9-.4 1.6-.9 2.1-1.4-3.2-2.9-6.7-4.1-11.1-3.7z"/><path d="M13.2 35.4c4.5 2.7 8.3 1.9 9.8-1.5.4-.9.6-1.7.5-2.4-4.3-.1-7.7 1.1-10.3 3.9z"/><path d="M32.8 35.4c-4.5 2.7-8.3 1.9-9.8-1.5-.4-.9-.6-1.7-.5-2.4 4.3-.1 7.7 1.1 10.3 3.9z"/><path d="M39.3 26c-2.1 4.8-5.6 6.7-9 5.1-.9-.4-1.6-.9-2.1-1.4 3.2-2.9 6.7-4.1 11.1-3.7z"/><path d="M32.8 20c.9 5.2-1.1 8.8-4.8 9.5-1 .2-1.8.2-2.5 0 1.1-4.2 3.4-7.3 7.3-9.5z"/></g></svg>',
    windows:'<svg viewBox="0 0 48 48" role="img" aria-label="Microsoft"><path fill="#F35325" d="M4 7 21 4.5v17H4z"/><path fill="#81BC06" d="M24 4.1 44 1v20.5H24z"/><path fill="#05A6F0" d="M4 24h17v17L4 38.5z"/><path fill="#FFBA08" d="M24 24h20v20.5L24 41z"/></svg>'
  };
  var stores=[
    {id:"ios",href:"https://apps.apple.com/app/id6826434377",en:"Apple App Store",tr:"Apple App Store",icon:icons.ios},
    {id:"android",href:"https://play.google.com/store/apps/details?id=com.columnist.lottoanalyticsai",en:"Google Play",tr:"Google Play",icon:icons.android},
    {id:"huawei",href:"https://appgallery.cloud.huawei.com/appDetail?pkgName=com.columnist.lottoanalyticsai",en:"Huawei AppGallery",tr:"Huawei AppGallery",icon:icons.huawei},
    {id:"harmony",href:"https://appgallery.cloud.huawei.com/appDetail?pkgName=com.columnist.lottoanalyticsai.next",en:"AppGallery • HarmonyOS NEXT",tr:"AppGallery • HarmonyOS NEXT",icon:icons.harmony},
    {id:"windows",href:"https://apps.microsoft.com/detail/9NXHVVZXZLC4",en:"Microsoft Store",tr:"Microsoft Store",icon:icons.windows}
  ];
  var nav=document.getElementById("stores");
  nav.innerHTML="";
  stores.forEach(function(store){
    var enabled=config[store.id]===true;
    var card=document.createElement(enabled?"a":"div");
    card.className="store"+(enabled?"":" is-disabled");
    card.setAttribute("data-store",store.id);
    if(enabled){
      card.href=store.href;
    }else{
      card.setAttribute("aria-disabled","true");
      card.title=tr?"Bu mağaza henüz etkin değil":"This store is not active yet";
    }
    card.innerHTML='<span class="store-icon">'+store.icon+'</span>'+
      '<span class="store-name">'+(tr?store.tr:store.en)+'</span>'+
      (enabled?'':'<span class="store-status">'+(tr?"Yakında":"Coming soon")+'</span>');
    nav.appendChild(card);
  });

  var bots=/googlebot|google-inspectiontool|googleother|bingbot|duckduckbot|slurp|baiduspider|yandexbot|applebot|facebookexternalhit|facebot|twitterbot|telegrambot|whatsapp|discordbot|slackbot|linkedinbot|pinterestbot|crawler|spider|bot\b/i.test(ua);
  var detectedStore=null;
  if(/openharmony|hmos\s*next|harmonyos(?:\s*(?:next|[5-9](?:\.|\b))|\/(?:5|6|7|8|9)(?:\.|\b))/i.test(ua)){
    detectedStore="harmony";
  }else if(/iphone|ipad|ipod/i.test(ua)||(lower.indexOf("macintosh")!==-1&&navigator.maxTouchPoints>1)){
    detectedStore="ios";
  }else if(/windows nt/i.test(ua)){
    detectedStore="windows";
  }else if(/macintosh|mac os x/i.test(ua)){
    detectedStore="ios";
  }else if(/android/i.test(ua)){
    detectedStore=/huawei|honor|huaweibrowser/i.test(ua)?"huawei":"android";
  }
  if(detectedStore&&config[detectedStore]===true&&!bots){
    var detected=stores.find(function(item){return item.id===detectedStore;});
    if(detected){
      var selected=nav.querySelector('[data-store="'+detectedStore+'"]');
      if(selected) selected.setAttribute("aria-current","true");
      window.setTimeout(function(){window.location.replace(detected.href);},180);
    }
  }
})();
</script>
</body>
</html>
